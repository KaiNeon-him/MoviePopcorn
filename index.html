<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
  
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://fonts.googleapis.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
    font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:;
    img-src 'self' data: https: blob:;
    media-src 'self' https: blob:;
    connect-src 'self' https://api.themoviedb.org https://vaplayer.ru https://vidapi.ru;
    frame-src https://vaplayer.ru https://vidapi.ru;
    worker-src 'self' blob:;
    manifest-src 'self';
  " />
  
  <title>MoviePopcorn - Stream Movies & TV Shows</title>
  
  <!-- PWA Meta Tags -->
  <meta name="description" content="Your ultimate destination for streaming movies and TV shows. Watch thousands of movies and TV shows in multiple languages." />
  <meta name="theme-color" content="#e50914" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MoviePopcorn" />
  <meta name="application-name" content="MoviePopcorn" />
  <meta name="mobile-web-app-capable" content="yes" />
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  
  <!-- PWA Icons -->
  <link rel="icon" type="image/svg+xml" href="/logo-popcorn-projector.svg" />
  <link rel="apple-touch-icon" href="/logo-popcorn-projector.svg" />
  
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    html.light,
    html.light body {
      background-color: #ffffff !important;
      color: #000000;
    }
    html.dark,
    html.dark body {
      background-color: #1a1a1a !important;
      color: #ffffff;
    }
  </style>
  
  <script>
    // Theme initialization
    (function () {
      const isInIframe = window.self !== window.top;

      function applyThemeToDOM(theme) {
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute("data-theme", theme);
      }

      if (isInIframe) {
        window.addEventListener("message", function (event) {
          if (event.data && typeof event.data.theme === "string") {
            const theme = event.data.theme;
            if (theme === "light" || theme === "dark") {
              applyThemeToDOM(theme);
            }
          }
        });
      } else {
        const storedTheme = localStorage.getItem('moviepopcorn_theme');
        applyThemeToDOM(storedTheme || "dark");
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('Service Worker registered with scope:', registration.scope);
          })
          .catch((error) => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
