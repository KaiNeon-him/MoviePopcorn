<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle (optional, can be removed for transparent) -->
  <circle cx="256" cy="256" r="256" fill="#0a0a0a"/>
  
  <g transform="translate(128, 100)">
    <!-- Projector Body -->
    <rect x="20" y="80" width="220" height="140" rx="12" fill="#1a1a1a" stroke="#e50914" stroke-width="4"/>
    
    <!-- Projector Lens -->
    <circle cx="240" cy="150" r="35" fill="#0a0a0a" stroke="#e50914" stroke-width="4"/>
    <circle cx="240" cy="150" r="25" fill="#1a1a1a" stroke="#e50914" stroke-width="2"/>
    <circle cx="240" cy="150" r="15" fill="#e50914" opacity="0.3"/>
    
    <!-- Projector Top Reel (smaller, decorative) -->
    <circle cx="80" cy="60" r="30" fill="#1a1a1a" stroke="#e50914" stroke-width="3"/>
    <circle cx="80" cy="60" r="10" fill="#e50914"/>
    <line x1="80" y1="40" x2="80" y2="80" stroke="#e50914" stroke-width="2"/>
    <line x1="60" y1="60" x2="100" y2="60" stroke="#e50914" stroke-width="2"/>
    
    <!-- Popcorn Bucket (merged with projector) -->
    <path d="M 60 100 L 70 240 L 190 240 L 200 100 Z" fill="url(#bucketGradient)" stroke="#e50914" stroke-width="4"/>
    
    <!-- Bucket Stripes (retro style) -->
    <path d="M 80 100 L 85 240" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <path d="M 110 100 L 112 240" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <path d="M 140 100 L 140 240" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <path d="M 170 100 L 168 240" stroke="#fff" stroke-width="3" opacity="0.4"/>
    
    <!-- Popcorn Kernels (overflowing from bucket) -->
    <circle cx="90" cy="95" r="12" fill="#f5c518"/>
    <circle cx="115" cy="85" r="14" fill="#fff"/>
    <circle cx="145" cy="90" r="13" fill="#f5c518"/>
    <circle cx="170" cy="95" r="12" fill="#fff"/>
    <circle cx="105" cy="75" r="10" fill="#fff" opacity="0.9"/>
    <circle cx="135" cy="70" r="11" fill="#f5c518" opacity="0.9"/>
    <circle cx="160" cy="78" r="10" fill="#fff" opacity="0.9"/>
    
    <!-- Play Button (integrated into projector) -->
    <path d="M 100 140 L 100 180 L 140 160 Z" fill="#e50914" stroke="#fff" stroke-width="3"/>
    
    <!-- Projector Base/Legs -->
    <rect x="40" y="220" width="30" height="40" rx="4" fill="#1a1a1a" stroke="#e50914" stroke-width="2"/>
    <rect x="190" y="220" width="30" height="40" rx="4" fill="#1a1a1a" stroke="#e50914" stroke-width="2"/>
    
    <!-- Film Strip (connecting reel to projector) -->
    <path d="M 80 90 Q 100 100 120 95" stroke="#e50914" stroke-width="3" fill="none" stroke-dasharray="5,3"/>
  </g>
  
  <defs>
    <linearGradient id="bucketGradient" x1="60" y1="100" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="50%" stop-color="#b20710"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
  </defs>
</svg>
